name: CI

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Weekly sweep for external link rot across the archive.
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HUGO_VERSION: 0.165.0
      HUGO_SHA256: f43494894cdf4a8630a201d5c828051c77f523cc66bb3938b30806835470ac20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Hugo
        run: |
          # Extended is required: the site encodes WebP through Hugo image processing.
          archive="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/$archive"
          echo "${HUGO_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" hugo
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Build site
        run: hugo --gc --minify --noBuildLock --printPathWarnings

      - name: Check internal links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --offline --root-dir "${{ github.workspace }}/public" public
          fail: true

      - name: Check external links
        # Link rot in an 18-year archive should be visible, not a merge blocker.
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-concurrency 8 --exclude-path public/tags public
          fail: false
          output: lychee-external.md

      - name: Upload external link report
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: external-link-report
          path: lychee-external.md
          if-no-files-found: ignore
