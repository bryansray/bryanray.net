name: Deploy site to Linode Object Storage

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-object-storage-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HUGO_VERSION: 0.165.0
      HUGO_SHA256: 5c3a37a5450b3e386e5b75a87a790fea2d04a796d75e171216c80ef48a32b432
      LINODE_BUCKET: www.bryanray.net
      LINODE_ENDPOINT: https://us-southeast-1.linodeobjects.com
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Hugo
        run: |
          archive="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/$archive"
          echo "${HUGO_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" hugo
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Build production site
        run: hugo --gc --minify --noBuildLock

      - name: Deploy to Object Storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.LINODE_OBJECT_STORAGE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.LINODE_OBJECT_STORAGE_SECRET_KEY }}
        run: |
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          aws --version
          aws --endpoint-url "$LINODE_ENDPOINT" s3 sync \
            public/ "s3://$LINODE_BUCKET/" \
            --acl public-read \
            --delete

          # HTML must revalidate so a deploy is visible immediately. Hugo's
          # fingerprinted stylesheet can be cached permanently.
          aws --endpoint-url "$LINODE_ENDPOINT" s3 cp \
            public/ "s3://$LINODE_BUCKET/" \
            --recursive \
            --exclude "*" \
            --include "*.html" \
            --acl public-read \
            --cache-control "no-cache" \
            --content-type "text/html"
          aws --endpoint-url "$LINODE_ENDPOINT" s3 cp \
            public/css/ "s3://$LINODE_BUCKET/css/" \
            --recursive \
            --exclude "*" \
            --include "site.*.css" \
            --acl public-read \
            --cache-control "public, max-age=31536000, immutable" \
            --content-type "text/css"

      - name: Purge Cloudflare cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          zone_id="$({
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --header "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/zones?name=bryanray.net&status=active"
          } | jq --exit-status --raw-output '.result | if length == 1 then .[0].id else error("expected one active bryanray.net zone") end')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
            "https://api.cloudflare.com/client/v4/zones/$zone_id/purge_cache" \
            | jq --exit-status '.success == true' >/dev/null
