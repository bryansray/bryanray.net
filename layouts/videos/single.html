{{ define "main" }}<article class="article shell"><header class="article-header"><a class="back-link" href="{{ "videos/" | relURL }}">← Videos</a><div class="post-meta"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time></div><h1>{{ .Title }}</h1>{{ with .Params.tags }}<div class="tag-row">{{ range . }}<a href="{{ (printf "tags/%s/" (. | urlize)) | relURL }}">{{ . }}</a>{{ end }}</div>{{ end }}</header><div class="article-body">{{ .Content }}</div><nav class="article-nav" aria-label="More episodes">{{ with .PrevInSection }}<a href="{{ .RelPermalink }}"><small>Older</small><span>← {{ .Title }}</span></a>{{ end }}{{ with .NextInSection }}<a class="next" href="{{ .RelPermalink }}"><small>Newer</small><span>{{ .Title }} →</span></a>{{ end }}</nav></article>{{ end }}
