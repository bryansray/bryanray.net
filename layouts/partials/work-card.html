{{ $item := .item }}<article class="work-card"><div class="work-card-top"><span class="work-icon">{{ $item.icon | default "↗" }}</span><span class="work-kind">{{ .kind }}</span></div><h3>{{ $item.title }}</h3><p>{{ $item.description }}</p><div class="chip-row">{{ range $item.tags }}<span>{{ . }}</span>{{ end }}</div><a href="{{ $item.url }}"{{ if strings.HasPrefix $item.url "http" }} target="_blank" rel="noopener"{{ end }}>Explore {{ $item.title }} <span>→</span></a></article>
