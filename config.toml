baseURL = "https://www.bryanray.net/"
locale = "en-US"
title = "Bryan Ray"

canonifyurls = true
enableRobotsTXT = true

# Related content is scored on shared tags, with a light nudge toward posts of a
# similar vintage. includeNewer matters here: the default only ever surfaces older
# posts, which would leave the 2008 material with no suggestions at all.
[related]
threshold = 60
includeNewer = true
toLower = true

[[related.indices]]
name = "tags"
weight = 100

[[related.indices]]
name = "date"
weight = 10

[pagination]
pagerSize = 20

[taxonomies]
tag = "tags"

[permalinks]
posts = "/:year/:month/:slug"

[markup.goldmark.renderer]
unsafe = true

[markup.highlight]
noClasses = false
codeFences = true
guessSyntax = true

[params]
author = "Bryan Ray"
info = "Code, Projects & Life"
description = "A developer's notebook about software, personal projects, and the moments in between."
keywords = "blog,developer,software,projects,personal"
avatar = "images/bryanray-headshot.jpeg"

footercontent = "Built with ♥️"

hidecredits = false
hidecopyright = false

rtl = false

math = true

# Menu links
[[menu.main]]
name = "Notebook"
weight = 1
url = "/posts"
[[menu.main]]
name = "Bookshelf"
weight = 4
url = "/bookshelf"
[[menu.main]]
name = "About"
weight = 5
url = "/about"
